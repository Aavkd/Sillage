[package]
name = "spike"
version = "0.1.0"
edition = "2021"

# Phase 00 spike — answers one question: does whisper-rs expose DTW word-level
# timestamps well enough to build the audio-synced editor on?
# CPU by default; build with --features cuda once CUDA Toolkit 12.x is installed.

[dependencies]
whisper-rs = "0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[features]
cuda = ["whisper-rs/cuda"]

# Sillage vendors whisper-rs-sys to carry PATCH 001 (streaming callback under DTW).
# See vendor/PATCHES.md before upgrading either crate.
[patch.crates-io]
whisper-rs-sys = { path = "../vendor/whisper-rs-sys" }

[profile.release]
opt-level = 3
