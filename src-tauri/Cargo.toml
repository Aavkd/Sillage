[package]
name = "sillage"
version = "0.1.0"
description = "Transcription audio locale, éditable, synchronisée à l'audio"
authors = ["MANTARA"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 keeps the app in a library so mobile targets and integration tests can reach it.
name = "sillage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `bundled` compiles SQLite into the binary: the app must never depend on a system
# sqlite3.dll, and the bundled build is the one that ships FTS5 (DESIGN-free requirement
# from ROADMAP phase 02, task 3). Default features are off to leave out the wasm ffi backend.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
# Measured in phase 03, on the two hot loops it added (PROGRESS.md, phase 01 debt n° 6):
# streaming SHA-256 runs at 673 Mo/s here against 276 Mo/s at `opt-level = "s"` — 2,4×. The
# peaks loop is indifferent. The cost is 1,86 Mo of binary (4,67 → 6,44 Mo), against a payload
# already dominated by 923 Mo of CUDA DLLs and 282 Mo of ffmpeg: 0,15 % of what ships.
opt-level = 3
# Still to settle in phase 04: `abort` makes it impossible to catch a panic at the command
# boundary, while CONCEPTION §8 requires « jamais un crash » on insufficient VRAM.
panic = "abort"
strip = true
