[package]
name = "sillage"
version = "0.1.0"
description = "Transcription audio locale, éditable, synchronisée à l'audio"
authors = ["MANTARA"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 keeps the app in a library so mobile targets and integration tests can reach it.
name = "sillage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `bundled` compiles SQLite into the binary: the app must never depend on a system
# sqlite3.dll, and the bundled build is the one that ships FTS5 (DESIGN-free requirement
# from ROADMAP phase 02, task 3). Default features are off to leave out the wasm ffi backend.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
